name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint / 单元测试 / 端到端测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: 端到端测试（Electron + 模拟服务器）
        timeout-minutes: 15
        run: set -o pipefail && xvfb-run -a npm run test:e2e:ci 2>&1 | tee e2e.log
      # Actions 日志下载要仓库权限，失败时把 spec 报告留成 artifact，PR 作者也能自己看
      - name: 上传 e2e 日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-log
          path: e2e.log
          if-no-files-found: warn
          retention-days: 7

  package:
    name: 打包 Windows 版
    runs-on: windows-latest
    needs: check
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: FN-Music-windows
          path: |
            release/*.exe
            release/*.blockmap
          if-no-files-found: error
          retention-days: 14
